name: Package

# Packages are built on request only: no push, pull request or tag starts this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    # KF6 and Qt ≥ 6.5 are not in the runner's own Ubuntu, so the build runs in the release it packages for.
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["26.04", "26.10"]
    steps:
      - name: Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        # Same list as ci.yml: the build compiles the UI tests too, so it needs their packages.
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates cmake ninja-build g++ dpkg-dev file nodejs \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev qt6-l10n-tools \
            libkirigami-dev libkf6statusnotifieritem-dev libkf6dbusaddons-dev \
            appstream desktop-file-utils \
            dbus-daemon fonts-dejavu-core qml6-module-qttest \
            qml6-module-org-kde-kirigami qml6-module-org-kde-desktop qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtcore qml6-module-qtqml qml6-module-qtqml-models
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -Wno-dev
          cmake --build build
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        # The container has no display; QApplication needs a platform even for --version.
        env:
          QT_QPA_PLATFORM: offscreen
        run: test "$(./build/pegel --version)" = "pegel ${GITHUB_REF_NAME#v}"
      - name: Package
        run: |
          cd build
          cpack -G DEB
          version=$(. /etc/os-release && echo "$VERSION_ID")
          for deb in *.deb; do mv "$deb" "${deb%_amd64.deb}_ubuntu${version}_amd64.deb"; done
      - uses: actions/upload-artifact@v7
        with:
          name: pegel-ubuntu-${{ matrix.ubuntu }}
          path: build/*.deb
